<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #0a0e17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      /* Dynamic animations */
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
      }
      @keyframes pulseOrb2 {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.55; }
      }
      @keyframes floatData1 {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateX(850px); opacity: 0; }
      }
      @keyframes floatData2 {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateX(700px); opacity: 0; }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }

      .animated-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseOrb 8s ease-in-out infinite;
      }
      .animated-orb-2 {
        transform-origin: 1000px 300px;
        animation: pulseOrb2 10s ease-in-out infinite;
      }
      .data-packet-1 {
        animation: floatData1 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .data-packet-2 {
        animation: floatData2 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite 2s;
      }
      .animated-wire {
        stroke-dasharray: 8, 12;
        animation: waveFlow 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Orbs (Kept behind foreground text) -->
  <g opacity="0.45">
    <circle class="animated-orb-1" cx="220" cy="110" r="160" fill="#6366f1" filter="url(#glow)" />
    <circle class="animated-orb-2" cx="980" cy="300" r="180" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="600" cy="200" r="130" fill="#8b5cf6" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Dynamic Connected Network Flows (Background Decoration) -->
  <g opacity="0.4">
    <!-- Curved API routing path 1 -->
    <path d="M 80 130 C 350 70, 750 200, 1120 130" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-wire" />
    <!-- Curved API routing path 2 -->
    <path d="M 120 340 C 450 270, 720 390, 1080 330" fill="none" stroke="#a855f7" stroke-width="1.8" class="animated-wire" />
    
    <!-- Dynamic Packet Pulses moving along paths -->
    <g class="data-packet-1">
      <circle cx="100" cy="130" r="5" fill="#38bdf8" filter="url(#softGlow)" />
      <circle cx="100" cy="130" r="2.5" fill="#ffffff" />
    </g>
    <g class="data-packet-2">
      <circle cx="140" cy="340" r="4.5" fill="#c084fc" filter="url(#softGlow)" />
      <circle cx="140" cy="340" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Safe layout with text always sharp & prominent -->
  
  <!-- Category Tag / Top Badge -->
  <g transform="translate(600, 72)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="-150" cy="0" r="5" fill="#10b981" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-135" y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">CURATED ECOSYSTEM • 2026</text>
  </g>

  <!-- Main Title (Highest Contrast & Prominence) -->
  <g transform="translate(600, 148)">
    <text text-anchor="middle" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome Developer Portal &amp; API Management
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(600, 192)">
    <text text-anchor="middle" font-size="19" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Enterprise SaaS Platforms, Open-Source API Gateways &amp; Lifecycle Governance
    </text>
  </g>

  <!-- Feature Highlights / Interactive Style Pills (Foreground) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: API Gateways -->
    <g transform="translate(-400, 0)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#06b6d4" />
      <text x="42" y="26" fill="#f1f5f9" font-size="13" font-weight="600">API Gateways</text>
    </g>

    <!-- Pill 2: Developer Portals -->
    <g transform="translate(-200, 0)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#8b5cf6" />
      <text x="42" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Developer Portals</text>
    </g>

    <!-- Pill 3: OpenAPI & Governance -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="195" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#ec4899" />
      <text x="42" y="26" fill="#f1f5f9" font-size="13" font-weight="600">OpenAPI &amp; Specs</text>
    </g>

    <!-- Pill 4: Open-Source First -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#10b981" />
      <text x="42" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Open-Source OSS</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Indicator Line -->
  <g transform="translate(600, 345)">
    <text text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" letter-spacing="1.5">
      KONG • APIGEE • GRAVITEE • TYK • TRAEFIK • ENVOY • WSO2 • SCALAR • BACKSTAGE
    </text>
  </g>
</svg>
